# paperMind CI pipeline
#
# Java analogy: this is your Maven/Gradle build + Surefire test runner,
# but triggered by git push instead of a local `mvn verify`.
#
# Runs on:
#   - every push to `develop` (fast feedback while building features)
#   - every push to `main`
#   - every PR targeting `main` (gate before merge from develop)
#
# Jobs:
#   lint  → ruff check (import sort + style) + ruff format check
#   test  → pytest unit tests only (no live Docker services needed)
#
# Eval job (hits live OpenSearch + Groq) is Phase 3 — added in Episode 11.3
# Deploy job (SSH to Oracle VM) is Phase 2 — added in Episode 10.4

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main          # PR from develop → main triggers this pipeline

jobs:

  # ─────────────────────────────────────────
  # Job 1: Lint
  # ruff check  = import sort (isort) + pyflakes style rules
  # ruff format = black-compatible formatter (check only, don't auto-fix in CI)
  #
  # Java analogy: Checkstyle + SpotBugs in one tool, ~100x faster
  # ─────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        # Reads `requires-python = ">=3.12,<3.13"` from pyproject.toml
        # Java analogy: <java.version>17</java.version> in pom.xml
        run: uv python install 3.12

      - name: Install dependencies
        # uv sync installs main + dev dependency groups from pyproject.toml
        # Java analogy: `mvn dependency:resolve` or `gradle dependencies`
        run: uv sync --all-groups

      - name: Run ruff lint
        # --output-format=github prints file::line annotations directly in the PR diff
        run: uv run ruff check --output-format=github src/ tests/

      - name: Run ruff format check
        # --check exits non-zero if any file would be reformatted
        # does NOT rewrite files — CI just fails and tells you what to fix locally
        run: uv run ruff format --check src/ tests/

  # ─────────────────────────────────────────
  # Job 2: Unit Tests
  # Runs only unit/ tests — no Docker, no OpenSearch, no Ollama, no Groq
  # Integration tests (tests/integration/) need live services → excluded here
  #
  # Java analogy: `mvn test -Dtest=**/unit/**` (Surefire with pattern filter)
  # ─────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint          # don't run tests if lint fails — fail fast

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Create .env.test
        # pytest-dotenv reads .env.test automatically (configured in pyproject.toml)
        # We write it from GitHub secrets so no real credentials are in the repo
        # Java analogy: writing a test application.properties from env vars
        run: |
          cat > .env.test << 'EOF'
          DEBUG=true
          ENVIRONMENT=development
          POSTGRES_DATABASE_URL=postgresql://test_user:test_pass@localhost:5432/test_db
          OPENSEARCH__HOST=http://localhost:9200
          OLLAMA_HOST=http://localhost:11434
          ARXIV__MAX_RESULTS=15
          JINA_API_KEY=test-key-not-real
          LANGFUSE__PUBLIC_KEY=test-key
          LANGFUSE__SECRET_KEY=test-key
          LANGFUSE__ENABLED=false
          TELEGRAM__BOT_TOKEN=test-token
          TELEGRAM__ENABLED=false
          EOF

      - name: Run unit tests
        # tests/unit/ only — these need no live services
        # tests/integration/ and tests/api/ need Docker stack → excluded
        # Java analogy: @Tag("unit") with maven-surefire excludes
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Upload coverage report
        # Only uploads if tests pass — gives you a coverage badge in the README
        # Java analogy: JaCoCo report upload to Codecov
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7